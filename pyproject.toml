[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kensei"
version = "0.1.0"
description = "Terminal-native security SLM harness for Ronin"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["security", "terminal", "ollama", "slm", "llm", "guardrails", "arch-linux"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "lxml>=5.2",
  "platformdirs>=4.2",
  "PyYAML>=6.0",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
check = ["transformers>=4.46", "jinja2>=3.1"]
train = [
  "torch>=2.4",
  "transformers>=4.46",
  "datasets>=3.0",
  "peft>=0.13",
  "accelerate>=1.0",
  "jinja2>=3.1",
]
train-cuda = [
  "torch>=2.4",
  "transformers>=4.46",
  "datasets>=3.0",
  "peft>=0.13",
  "accelerate>=1.0",
  "jinja2>=3.1",
  "bitsandbytes>=0.44",
]

[project.scripts]
kensei = "kensei.cli:main"

[project.urls]
Homepage = "https://github.com/Davoassassin27/kensei"
Repository = "https://github.com/Davoassassin27/kensei"
Issues = "https://github.com/Davoassassin27/kensei/issues"
Ronin = "https://github.com/Davoassassin27/ronin"

[tool.hatch.build.targets.wheel]
packages = ["src/kensei"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
